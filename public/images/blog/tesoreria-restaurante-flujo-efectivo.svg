<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo oscuro -->
  <rect width="1200" height="630" fill="#07080a"/>
  
  <!-- Elementos decorativos de acento -->
  <defs>
    <linearGradient id="gradVolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ceff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45e5ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Formas geométricas de fondo -->
  <circle cx="100" cy="80" r="60" fill="#ceff00" opacity="0.1"/>
  <circle cx="1100" cy="550" r="80" fill="#45e5ff" opacity="0.1"/>
  <rect x="150" y="400" width="200" height="150" fill="#45e5ff" opacity="0.05" rx="10"/>
  
  <!-- Título principal -->
  <text x="600" y="140" font-size="72" font-weight="bold" fill="#e8e6e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Tesorería
  </text>
  <text x="600" y="220" font-size="72" font-weight="bold" fill="#ceff00" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Automatizada
  </text>
  
  <!-- Subtítulo -->
  <text x="600" y="280" font-size="28" fill="#8b9098" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Flujos de efectivo en restaurantes
  </text>
  
  <!-- Iconografía simple: billete y monedas -->
  <g transform="translate(200, 380)">
    <rect x="0" y="0" width="80" height="50" fill="none" stroke="#ceff00" stroke-width="3" rx="4"/>
    <line x1="20" y1="0" x2="20" y2="50" stroke="#ceff00" stroke-width="2"/>
    <text x="40" y="35" font-size="24" fill="#ceff00" text-anchor="middle" font-weight="bold">$</text>
  </g>
  
  <!-- Iconografía: gráfico de flujo -->
  <g transform="translate(900, 360)">
    <circle cx="30" cy="30" r="20" fill="none" stroke="#45e5ff" stroke-width="2"/>
    <path d="M 30 10 L 50 30 L 30 50" fill="none" stroke="#45e5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Pie de página -->
  <text x="600" y="600" font-size="18" fill="#8b9098" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Optimiza tu flujo de caja con automatización operativa
  </text>
</svg>
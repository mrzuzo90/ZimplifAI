<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow-volt-3" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ceff00" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ceff00" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-plasma-3" cx="20%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#45e5ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#45e5ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <linearGradient id="card-border-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ceff00" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#45e5ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#07080a" />
  <rect width="1200" height="630" fill="url(#grid-3)" />
  <rect width="1200" height="630" fill="url(#glow-volt-3)" />
  <rect width="1200" height="630" fill="url(#glow-plasma-3)" />

  <!-- Frame border -->
  <rect x="32" y="32" width="1136" height="566" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Corner markers -->
  <path d="M 32 60 L 32 32 L 60 32" fill="none" stroke="#ceff00" stroke-width="2" />
  <path d="M 1168 60 L 1168 32 L 1140 32" fill="none" stroke="#ceff00" stroke-width="2" />
  <path d="M 32 570 L 32 598 L 60 598" fill="none" stroke="#45e5ff" stroke-width="2" />
  <path d="M 1168 570 L 1168 598 L 1140 598" fill="none" stroke="#45e5ff" stroke-width="2" />

  <!-- Top bar info -->
  <text x="70" y="80" fill="#ceff00" font-family="monospace" font-size="14" letter-spacing="4">// ZIMPLIFAI BLOG · 03</text>
  <text x="1130" y="80" text-anchor="end" fill="#8b9098" font-family="monospace" font-size="14" letter-spacing="2">NORMATIVA ESPAÑA · FISCAL &amp; TECH</text>
  <line x1="70" y1="105" x2="1130" y2="105" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Graphic illustration on the right: Hash Chain / Ticket with QR -->
  <g transform="translate(690, 150)">
    <!-- Ticket / Invoice Card -->
    <rect x="50" y="20" width="320" height="340" rx="14" fill="#101319" stroke="url(#card-border-3)" stroke-width="1.5" />

    <!-- Receipt Header -->
    <text x="75" y="60" fill="#e8e6e1" font-family="monospace" font-weight="bold" font-size="14">FACTURA SIMPLIFICADA</text>
    <text x="75" y="78" fill="#8b9098" font-family="monospace" font-size="10">REGISTRO SIF CONFORME RD 1007/2023</text>
    <line x1="75" y1="95" x2="345" y2="95" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2,2" />

    <!-- Chain Hash -->
    <text x="75" y="125" fill="#45e5ff" font-family="monospace" font-size="10">HASH ANTERIOR:</text>
    <text x="75" y="142" fill="#8b9098" font-family="monospace" font-size="9">e3b0c44298fc1c149afbf4c8996fb92427ae41e4...</text>

    <text x="75" y="175" fill="#ceff00" font-family="monospace" font-size="10">HASH ACTUAL (SHA-256):</text>
    <text x="75" y="192" fill="#e8e6e1" font-family="monospace" font-size="9">8f4e2b01c3d9a74421b0e95cb2140a331189ac3f...</text>

    <!-- QR Code Visual -->
    <g transform="translate(75, 220)">
      <rect x="0" y="0" width="80" height="80" rx="6" fill="#171b23" stroke="#ceff00" stroke-width="1" />
      <!-- Stylized QR blocks -->
      <rect x="8" y="8" width="20" height="20" fill="#ceff00" />
      <rect x="12" y="12" width="12" height="12" fill="#171b23" />
      <rect x="52" y="8" width="20" height="20" fill="#ceff00" />
      <rect x="56" y="12" width="12" height="12" fill="#171b23" />
      <rect x="8" y="52" width="20" height="20" fill="#ceff00" />
      <rect x="12" y="56" width="12" height="12" fill="#171b23" />
      <rect x="36" y="36" width="8" height="8" fill="#45e5ff" />
      <rect x="48" y="52" width="12" height="12" fill="#45e5ff" />
      <rect x="36" y="16" width="8" height="8" fill="#e8e6e1" />
    </g>

    <!-- QR Caption -->
    <text x="175" y="245" fill="#ceff00" font-family="monospace" font-weight="bold" font-size="12">VERI*FACTU</text>
    <text x="175" y="265" fill="#8b9098" font-family="monospace" font-size="10">Cotejo inmediato AEAT</text>
    <text x="175" y="285" fill="#45e5ff" font-family="monospace" font-size="10">Inalterabilidad 100%</text>
  </g>

  <!-- Title & copy on left -->
  <g transform="translate(70, 200)">
    <rect x="0" y="0" width="210" height="32" rx="16" fill="rgba(206, 255, 0, 0.08)" stroke="rgba(206, 255, 0, 0.3)" />
    <text x="105" y="21" text-anchor="middle" fill="#ceff00" font-family="monospace" font-size="12" letter-spacing="2">NORMATIVA TPV Y FISCAL</text>

    <text x="0" y="80" fill="#e8e6e1" font-family="sans-serif" font-weight="bold" font-size="38" letter-spacing="-1">
      VeriFactu y facturación
    </text>
    <text x="0" y="130" fill="#ceff00" font-family="sans-serif" font-weight="bold" font-size="38" letter-spacing="-1">
      electrónica obligatoria:
    </text>
    <text x="0" y="180" fill="#e8e6e1" font-family="sans-serif" font-weight="bold" font-size="38" letter-spacing="-1">
      qué cambia para restaurantes.
    </text>

    <text x="0" y="245" fill="#8b9098" font-family="sans-serif" font-size="18">
      Códigos QR, hash encadenado, plazos legales y cómo adaptarte sin estrés.
    </text>
  </g>

  <!-- Bottom status -->
  <g transform="translate(70, 550)">
    <circle cx="8" cy="8" r="6" fill="#ceff00" />
    <text x="26" y="13" fill="#8b9098" font-family="monospace" font-size="13">ZIMPLIFAI · GUÍA TÉCNICA · LECTURA: 8 MIN</text>
  </g>
</svg>

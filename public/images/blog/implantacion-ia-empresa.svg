<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow-volt-1" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ceff00" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ceff00" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-plasma-1" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#45e5ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#45e5ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <linearGradient id="card-border-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ceff00" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#45e5ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#07080a" />
  <rect width="1200" height="630" fill="url(#grid-1)" />
  <rect width="1200" height="630" fill="url(#glow-volt-1)" />
  <rect width="1200" height="630" fill="url(#glow-plasma-1)" />

  <!-- Frame border -->
  <rect x="32" y="32" width="1136" height="566" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Corner markers -->
  <path d="M 32 60 L 32 32 L 60 32" fill="none" stroke="#ceff00" stroke-width="2" />
  <path d="M 1168 60 L 1168 32 L 1140 32" fill="none" stroke="#ceff00" stroke-width="2" />
  <path d="M 32 570 L 32 598 L 60 598" fill="none" stroke="#45e5ff" stroke-width="2" />
  <path d="M 1168 570 L 1168 598 L 1140 598" fill="none" stroke="#45e5ff" stroke-width="2" />

  <!-- Top bar info -->
  <text x="70" y="80" fill="#ceff00" font-family="monospace" font-size="14" letter-spacing="4">// ZIMPLIFAI BLOG · 01</text>
  <text x="1130" y="80" text-anchor="end" fill="#8b9098" font-family="monospace" font-size="14" letter-spacing="2">ESTRATEGIA &amp; OPERACIONES</text>
  <line x1="70" y1="105" x2="1130" y2="105" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Graphic illustration on the right -->
  <g transform="translate(680, 160)">
    <rect x="40" y="40" width="160" height="60" rx="8" fill="#101319" stroke="url(#card-border-1)" stroke-width="1.5" />
    <text x="120" y="75" text-anchor="middle" fill="#e8e6e1" font-family="monospace" font-size="12">AUDITORÍA</text>

    <line x1="200" y1="70" x2="260" y2="70" stroke="#ceff00" stroke-width="2" stroke-dasharray="4,4" />

    <rect x="260" y="40" width="160" height="60" rx="8" fill="#101319" stroke="#ceff00" stroke-width="1.5" />
    <text x="340" y="75" text-anchor="middle" fill="#ceff00" font-family="monospace" font-size="12">PILOTO IA</text>

    <path d="M 340 100 L 340 160 L 120 160 L 120 190" fill="none" stroke="#45e5ff" stroke-width="1.5" />
    <path d="M 340 100 L 340 190" fill="none" stroke="#ceff00" stroke-width="1.5" />

    <rect x="40" y="190" width="160" height="60" rx="8" fill="#101319" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="120" y="225" text-anchor="middle" fill="#8b9098" font-family="monospace" font-size="12">INTEGRACIÓN</text>

    <rect x="260" y="190" width="160" height="60" rx="8" fill="#101319" stroke="#45e5ff" stroke-width="1.5" />
    <text x="340" y="225" text-anchor="middle" fill="#45e5ff" font-family="monospace" font-size="12">ESCALADO</text>

    <circle cx="200" cy="70" r="4" fill="#ceff00" />
    <circle cx="340" cy="140" r="4" fill="#45e5ff" />
  </g>

  <!-- Title & copy on left -->
  <g transform="translate(70, 210)">
    <rect x="0" y="0" width="170" height="32" rx="16" fill="rgba(206, 255, 0, 0.08)" stroke="rgba(206, 255, 0, 0.3)" />
    <text x="85" y="21" text-anchor="middle" fill="#ceff00" font-family="monospace" font-size="12" letter-spacing="2">GUÍA PRÁCTICA</text>

    <text x="0" y="85" fill="#e8e6e1" font-family="sans-serif" font-weight="bold" font-size="42" letter-spacing="-1">
      Qué es la implantación de IA
    </text>
    <text x="0" y="138" fill="#e8e6e1" font-family="sans-serif" font-weight="bold" font-size="42" letter-spacing="-1">
      en una empresa real
    </text>
    <text x="0" y="191" fill="#ceff00" font-family="sans-serif" font-weight="bold" font-size="42" letter-spacing="-1">
      y por dónde empezar.
    </text>

    <text x="0" y="255" fill="#8b9098" font-family="sans-serif" font-size="18">
      Detección de cuellos de botella, automatización útil y despliegue sin humo.
    </text>
  </g>

  <!-- Bottom status -->
  <g transform="translate(70, 550)">
    <circle cx="8" cy="8" r="6" fill="#ceff00" />
    <text x="26" y="13" fill="#8b9098" font-family="monospace" font-size="13">ZIMPLIFAI · GUÍA TÉCNICA · LECTURA: 7 MIN</text>
  </g>
</svg>

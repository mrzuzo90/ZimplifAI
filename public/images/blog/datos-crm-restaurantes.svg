<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow-volt-4" cx="80%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#ceff00" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ceff00" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-plasma-4" cx="20%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#45e5ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#45e5ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <linearGradient id="card-border-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45e5ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ceff00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#07080a" />
  <rect width="1200" height="630" fill="url(#grid-4)" />
  <rect width="1200" height="630" fill="url(#glow-volt-4)" />
  <rect width="1200" height="630" fill="url(#glow-plasma-4)" />

  <!-- Frame border -->
  <rect x="32" y="32" width="1136" height="566" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Corner markers -->
  <path d="M 32 60 L 32 32 L 60 32" fill="none" stroke="#ceff00" stroke-width="2" />
  <path d="M 1168 60 L 1168 32 L 1140 32" fill="none" stroke="#ceff00" stroke-width="2" />
  <path d="M 32 570 L 32 598 L 60 598" fill="none" stroke="#45e5ff" stroke-width="2" />
  <path d="M 1168 570 L 1168 598 L 1140 598" fill="none" stroke="#45e5ff" stroke-width="2" />

  <!-- Top bar info -->
  <text x="70" y="80" fill="#ceff00" font-family="monospace" font-size="14" letter-spacing="4">// ZIMPLIFAI BLOG · 04</text>
  <text x="1130" y="80" text-anchor="end" fill="#8b9098" font-family="monospace" font-size="14" letter-spacing="2">OPERACIONES HOSTELERÍA · ESTRUCTURA DE DATOS</text>
  <line x1="70" y1="105" x2="1130" y2="105" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Graphic illustration on the right: Structured Data Schema Console -->
  <g transform="translate(670, 140)">
    <!-- Main schema box -->
    <rect x="30" y="20" width="370" height="360" rx="16" fill="#101319" stroke="url(#card-border-4)" stroke-width="1.5" />

    <!-- Top mini header -->
    <rect x="30" y="20" width="370" height="38" rx="16" fill="#171b23" />
    <circle cx="55" cy="39" r="4" fill="#ceff00" />
    <text x="70" y="44" fill="#e8e6e1" font-family="monospace" font-size="11">SCHEMA · RESTAURANT_CONFIG.JSON</text>
    <rect x="330" y="32" width="55" height="15" rx="7" fill="rgba(69, 229, 255, 0.2)" />
    <text x="357" y="43" text-anchor="middle" fill="#45e5ff" font-family="monospace" font-size="9">VALID</text>

    <!-- Block 1: Mesas & Zonas -->
    <rect x="50" y="75" width="330" height="65" rx="8" fill="#171b23" stroke="rgba(255,255,255,0.06)" />
    <text x="65" y="96" fill="#45e5ff" font-family="monospace" font-size="11">inventory: { tables: 18, zones: ["sala", "terraza"] }</text>
    <text x="65" y="115" fill="#8b9098" font-family="monospace" font-size="10">combinations: [ { t1_t2: 6pax }, { t5_t6: 8pax } ]</text>
    <text x="65" y="130" fill="#ceff00" font-family="monospace" font-size="10">status: capacity_mapped</text>

    <!-- Block 2: Turnos & Tiempos -->
    <rect x="50" y="152" width="330" height="65" rx="8" fill="#171b23" stroke="rgba(206, 255, 0, 0.2)" />
    <text x="65" y="173" fill="#ceff00" font-family="monospace" font-size="11">shifts: [ { s1: "13:30", max_stay: 105m } ]</text>
    <text x="65" y="192" fill="#8b9098" font-family="monospace" font-size="10">grace_period: 15m · buffer_turnaround: 15m</text>
    <text x="65" y="207" fill="#45e5ff" font-family="monospace" font-size="10">auto_release_no_show: true</text>

    <!-- Block 3: Políticas & Alérgenos -->
    <rect x="50" y="229" width="330" height="65" rx="8" fill="#171b23" stroke="rgba(255,255,255,0.06)" />
    <text x="65" y="250" fill="#e8e6e1" font-family="monospace" font-size="11">group_policy: { min_pax: 8, deposit_req: true }</text>
    <text x="65" y="269" fill="#8b9098" font-family="monospace" font-size="10">allergens_matrix: 14_eu_regulated_ready</text>
    <text x="65" y="284" fill="#45e5ff" font-family="monospace" font-size="10">fallback_to_manager: true</text>

    <!-- Metrics footer -->
    <line x1="50" y1="310" x2="380" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="60" y="340" fill="#ceff00" font-family="monospace" font-weight="bold" font-size="13">DATOS LIMPIOS</text>
    <text x="60" y="358" fill="#8b9098" font-family="monospace" font-size="9">CERO AMBIGÜEDAD</text>

    <text x="185" y="340" fill="#45e5ff" font-family="monospace" font-weight="bold" font-size="13">REGLAS CLARAS</text>
    <text x="185" y="358" fill="#8b9098" font-family="monospace" font-size="9">SIN IMPROVISAR</text>

    <text x="300" y="340" fill="#e8e6e1" font-family="monospace" font-weight="bold" font-size="13">SALA LISTA</text>
    <text x="300" y="358" fill="#8b9098" font-family="monospace" font-size="9">PASE FLUIDO</text>
  </g>

  <!-- Title & copy on left -->
  <g transform="translate(70, 190)">
    <rect x="0" y="0" width="230" height="32" rx="16" fill="rgba(206, 255, 0, 0.08)" stroke="rgba(206, 255, 0, 0.3)" />
    <text x="115" y="21" text-anchor="middle" fill="#ceff00" font-family="monospace" font-size="12" letter-spacing="2">OPERACIONES REALES</text>

    <text x="0" y="80" fill="#e8e6e1" font-family="sans-serif" font-weight="bold" font-size="38" letter-spacing="-1">
      Datos mínimos que ordenar
    </text>
    <text x="0" y="130" fill="#45e5ff" font-family="sans-serif" font-weight="bold" font-size="38" letter-spacing="-1">
      antes de automatizar
    </text>
    <text x="0" y="180" fill="#ceff00" font-family="sans-serif" font-weight="bold" font-size="38" letter-spacing="-1">
      reservas y WhatsApp.
    </text>

    <text x="0" y="240" fill="#8b9098" font-family="sans-serif" font-size="17">
      Inventario de mesas, turnos, cocina y políticas: la base para que un bot no cree caos en sala.
    </text>
  </g>

  <!-- Bottom status -->
  <g transform="translate(70, 550)">
    <circle cx="8" cy="8" r="6" fill="#ceff00" />
    <text x="26" y="13" fill="#8b9098" font-family="monospace" font-size="13">ZIMPLIFAI · ARQUITECTURA OPERATIVA · LECTURA: 5 MIN</text>
  </g>
</svg>

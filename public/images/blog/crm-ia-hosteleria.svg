<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow-volt-2" cx="75%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ceff00" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ceff00" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-plasma-2" cx="25%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#45e5ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#45e5ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <linearGradient id="card-border-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45e5ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ceff00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#07080a" />
  <rect width="1200" height="630" fill="url(#grid-2)" />
  <rect width="1200" height="630" fill="url(#glow-volt-2)" />
  <rect width="1200" height="630" fill="url(#glow-plasma-2)" />

  <!-- Frame border -->
  <rect x="32" y="32" width="1136" height="566" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Corner markers -->
  <path d="M 32 60 L 32 32 L 60 32" fill="none" stroke="#45e5ff" stroke-width="2" />
  <path d="M 1168 60 L 1168 32 L 1140 32" fill="none" stroke="#45e5ff" stroke-width="2" />
  <path d="M 32 570 L 32 598 L 60 598" fill="none" stroke="#ceff00" stroke-width="2" />
  <path d="M 1168 570 L 1168 598 L 1140 598" fill="none" stroke="#ceff00" stroke-width="2" />

  <!-- Top bar info -->
  <text x="70" y="80" fill="#45e5ff" font-family="monospace" font-size="14" letter-spacing="4">// ZIMPLIFAI BLOG · 02</text>
  <text x="1130" y="80" text-anchor="end" fill="#8b9098" font-family="monospace" font-size="14" letter-spacing="2">HOSTELERÍA &amp; AUTOMATIZACIÓN</text>
  <line x1="70" y1="105" x2="1130" y2="105" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Graphic illustration on the right: Hospitality CRM Dashboard Wireframe -->
  <g transform="translate(680, 150)">
    <!-- Phone / Console Mockup -->
    <rect x="50" y="20" width="340" height="340" rx="16" fill="#101319" stroke="url(#card-border-2)" stroke-width="1.5" />

    <!-- Top mini header -->
    <rect x="50" y="20" width="340" height="38" rx="16" fill="#171b23" />
    <circle cx="75" cy="39" r="4" fill="#45e5ff" />
    <text x="90" y="44" fill="#e8e6e1" font-family="monospace" font-size="11">CRM HOSPITALITY BOT</text>
    <rect x="330" y="32" width="45" height="15" rx="7" fill="rgba(206, 255, 0, 0.2)" />
    <text x="352" y="43" text-anchor="middle" fill="#ceff00" font-family="monospace" font-size="9">EN VIVO</text>

    <!-- Chat/Event bubbles inside -->
    <rect x="70" y="80" width="220" height="46" rx="8" fill="#171b23" stroke="rgba(255,255,255,0.06)" />
    <text x="82" y="100" fill="#8b9098" font-family="monospace" font-size="10">WhatsApp · Reserva mesa 4 pax</text>
    <text x="82" y="116" fill="#ceff00" font-family="monospace" font-size="11">✓ Confirmada con 1 clic (no-show 0%)</text>

    <rect x="130" y="140" width="240" height="54" rx="8" fill="#171b23" stroke="rgba(69, 229, 255, 0.25)" />
    <text x="142" y="160" fill="#8b9098" font-family="monospace" font-size="10">IA Conversacional 23:45h</text>
    <text x="142" y="176" fill="#45e5ff" font-family="monospace" font-size="11">Responde carta alérgenos y parking</text>

    <rect x="70" y="210" width="250" height="50" rx="8" fill="#171b23" stroke="rgba(255,255,255,0.06)" />
    <text x="82" y="230" fill="#8b9098" font-family="monospace" font-size="10">Post-servicio automatizado</text>
    <text x="82" y="246" fill="#e8e6e1" font-family="monospace" font-size="11">Filtro de satisfacción previo a Google</text>

    <!-- Stats footer inside console -->
    <line x1="70" y1="280" x2="370" y2="280" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="75" y="315" fill="#ceff00" font-family="monospace" font-weight="bold" font-size="20">-80%</text>
    <text x="75" y="335" fill="#8b9098" font-family="monospace" font-size="9">NO-SHOWS</text>

    <text x="190" y="315" fill="#45e5ff" font-family="monospace" font-weight="bold" font-size="20">24/7</text>
    <text x="190" y="335" fill="#8b9098" font-family="monospace" font-size="9">RESPUESTA</text>

    <text x="290" y="315" fill="#e8e6e1" font-family="monospace" font-weight="bold" font-size="20">100%</text>
    <text x="290" y="335" fill="#8b9098" font-family="monospace" font-size="9">SIN ESTRÉS</text>
  </g>

  <!-- Title & copy on left -->
  <g transform="translate(70, 210)">
    <rect x="0" y="0" width="200" height="32" rx="16" fill="rgba(69, 229, 255, 0.08)" stroke="rgba(69, 229, 255, 0.3)" />
    <text x="100" y="21" text-anchor="middle" fill="#45e5ff" font-family="monospace" font-size="12" letter-spacing="2">OPERACIONES RESTAURANTE</text>

    <text x="0" y="85" fill="#e8e6e1" font-family="sans-serif" font-weight="bold" font-size="42" letter-spacing="-1">
      CRM con IA para hostelería:
    </text>
    <text x="0" y="138" fill="#45e5ff" font-family="sans-serif" font-weight="bold" font-size="42" letter-spacing="-1">
      qué automatizar primero
    </text>
    <text x="0" y="191" fill="#ceff00" font-family="sans-serif" font-weight="bold" font-size="42" letter-spacing="-1">
      para ver retorno inmediato.
    </text>

    <text x="0" y="255" fill="#8b9098" font-family="sans-serif" font-size="18">
      Menos no-shows, respuestas 24/7 y clientes habituales sin saturar a la sala.
    </text>
  </g>

  <!-- Bottom status -->
  <g transform="translate(70, 550)">
    <circle cx="8" cy="8" r="6" fill="#45e5ff" />
    <text x="26" y="13" fill="#8b9098" font-family="monospace" font-size="13">ZIMPLIFAI · GUÍA TÉCNICA · LECTURA: 6 MIN</text>
  </g>
</svg>
